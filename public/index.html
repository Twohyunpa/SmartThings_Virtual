<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartThings Virtual Device Panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◎</span>
      <div>
        <h1>SmartThings Virtual Device Panel</h1>
        <p class="sub">You play the device: create virtual devices and report their state to SmartThings</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="cliBadge" class="badge">Checking CLI…</span>
      <div class="account">
        <button id="accountBtn" class="btn small account-btn" aria-haspopup="true" aria-expanded="false">
          <span id="accountDot" class="dot"></span><span id="accountLabel">Checking account…</span> ▾
        </button>
        <div id="accountMenu" class="account-menu" hidden></div>
      </div>
      <label class="profile">
        Profile
        <input id="profileInput" value="default" size="10" />
      </label>
      <button id="profileApply" class="btn ghost small">Apply</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-head">
        <select id="locationFilter" title="Filter by location"><option value="">All locations</option></select>
        <button id="refreshDevices" class="btn ghost small" title="Refresh">↻</button>
      </div>
      <button id="newDeviceBtn" class="btn primary full">＋ New virtual device</button>
      <div id="deviceList" class="device-list"><div class="muted pad">Loading…</div></div>
    </aside>

    <main id="main" class="main"></main>
  </div>

  <section id="logDrawer" class="log-drawer collapsed">
    <div class="log-head">
      <button id="logToggle" class="link">▲ CLI command log <span id="logCount" class="count">0</span></button>
      <span class="muted small">Shows the exact commands the UI runs. Click one to copy it into your own scripts.</span>
      <button id="logClear" class="btn ghost small">Clear</button>
    </div>
    <div id="logBody" class="log-body"></div>
  </section>

  <div id="toasts" class="toasts"></div>

  <template id="welcomeTpl">
    <div class="welcome">
      <h2>Getting started</h2>
      <ol>
        <li>Click <b>＋ New virtual device</b> on the left and create a device from a Samsung appliance, an IoT device type or a standard prototype.</li>
        <li>Pick a device from the list to see its current state and input controls for each capability.</li>
        <li>Change a value and press <b>Inject</b> to send an event with <code>smartthings virtualdevices:events</code>.</li>
        <li>Use the <b>Presets &amp; scenarios</b> tab to replay several events in order, with delays.</li>
      </ol>
      <p class="muted">The app uses the SmartThings account the CLI is signed in to. The account menu at the top right shows which one, and lets you log out or switch to another account.</p>
    </div>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
</html>
